<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .card-bg { fill: #1e293b; }
      .bird-grey { fill: #b8b0a5; }
      .bird-dark-grey { fill: #8d7e71; }
      .bird-orange { fill: #e65a28; }
      .branch-brown { fill: #8b5d43; }
      .beak-yellow { fill: #f1c40f; }
      .eye-black { fill: #1a1a1a; }
    </style>

    <path id="bobby-body-shape" d="
      M 55, 90
      A 45 50 0 0 1 145 90
      L 145 95
      A 40.5 45 0 0 1 100 140
      A 40.5 45 0 0 1 55 95
      Z" 
    />
    
    <clipPath id="body-clip">
      <use href="#bobby-body-shape" />
    </clipPath>
  </defs>

  <rect class="card-bg" width="200" height="200" />

  <path class="bird-grey" d="M87.5,115 h25 v30 a10,10 0 0,1 -10,10 h-5 a10,10 0 0,1 -10,-10 Z" />

  <g clip-path="url(#body-clip)">
    
    <rect class="bird-grey" x="55" y="40" width="90" height="100" />

    <path class="bird-dark-grey" d="M73,40 h54 v10 a15,15 0 0,1 -15,15 h-24 a15,15 0 0,1 -15,-15 Z" />

    <circle class="bird-orange" cx="100" cy="95" r="35" />
  </g>

  <circle class="eye-black" cx="81" cy="78" r="3.5" />
  <circle class="eye-black" cx="119" cy="78" r="3.5" />
  
  <path class="beak-yellow" d="M95,82 h10 L100,89 Z" />

  <rect class="bird-dark-grey" x="84.5" y="130" width="8" height="12" rx="3" />
  <rect class="bird-dark-grey" x="107.5" y="130" width="8" height="12" rx="3" />

  <rect class="branch-brown" x="30" y="133" width="140" height="12" rx="6" />

</svg>